# API 后端服务 - api.lottery.flutterbbs.cn
server {
    listen 80;
    server_name api.lottery.flutterbbs.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.lottery.flutterbbs.cn;

    ssl_certificate /etc/nginx/ssl/api.lottery.flutterbbs.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/api.lottery.flutterbbs.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 微信验证文件
    location ~ ^/MP_verify_.*\.txt$ {
        root /var/www/wechat-verify;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

