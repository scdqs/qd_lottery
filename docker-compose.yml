version: '3.8'

services:
  backend:
    build: ./backend
    container_name: lottery-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=https://pc.lottery.flutterbbs.cn,https://h5.lottery.flutterbbs.cn,https://api.lottery.flutterbbs.cn
      - WECHAT_APP_ID=wx9044804b3d25d5b6
      - WECHAT_APP_SECRET=2188660ae26d697b338f124b49d8fe8c
      - WECHAT_REDIRECT_URI=https://api.lottery.flutterbbs.cn/api/wechat/callback
      - H5_BASE_URL=https://h5.lottery.flutterbbs.cn
    restart: unless-stopped
    networks:
      - lottery-network

  web-client:
    build: ./web-client
    container_name: lottery-web
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lottery-network

  h5-client:
    build: ./h5-client
    container_name: lottery-h5
    ports:
      - "3002:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lottery-network

networks:
  lottery-network:
    driver: bridge
